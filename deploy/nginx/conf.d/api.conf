log_format api_json escape=json
    '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"request_length":$request_length,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"limit_req_status":"$limit_req_status"'
    '}';

error_log /dev/stderr warn;

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;

upstream org_structure_api {
    zone org_structure_api 64k;

    server app:8080 resolve;

    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    access_log /dev/stdout api_json;

    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types application/json application/problem+json;

    add_header X-Request-ID $request_id always;
    add_header X-Content-Type-Options nosniff always;

    error_page 413 = @payload_too_large;
    error_page 429 = @rate_limited;

    location = /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","nginx":"available"}\n';
    }

    location / {
        proxy_pass http://org_structure_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;

        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;

        proxy_request_buffering on;
        proxy_buffering on;
        proxy_cache off;
        proxy_intercept_errors off;

        limit_req zone=api_per_ip burst=20 nodelay;
        limit_req_dry_run on;
        limit_req_status 429;
        limit_req_log_level warn;
    }

    location @payload_too_large {
        internal;
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"request body is too large"}}';
    }

    location @rate_limited {
        internal;
        default_type application/json;
        return 429 '{"error":{"code":"rate_limit_exceeded","message":"too many requests"}}';
    }
}
